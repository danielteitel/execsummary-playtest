	<head><script>(function(){
var KEY='exec-summary-reset-career',DB='/userfs';
try{if(localStorage.getItem(KEY)!=='1')return;localStorage.removeItem(KEY);}
catch(e){return;}
window.stop();
document.title='Reset the career';
var body=document.body;
if(!body){body=document.createElement('body');document.documentElement.appendChild(body);}
body.setAttribute('style','margin:0;padding:1.5rem 1.25rem;background:#1a1712;'
 +'color:#e3d9c6;font:16px/1.5 -apple-system,system-ui,sans-serif;text-align:center');
body.innerHTML='<h1 style="font-size:1.375rem;margin:0 0 .5rem">Reset the career</h1>'
 +'<p id="m" style="margin:0 0 1.25rem;color:#a89e8c">Clearing...</p>'
 +'<button id="b" style="-webkit-appearance:none;appearance:none;display:none;'
 +'width:100%;max-width:22rem;box-sizing:border-box;padding:1.05rem;border:0;'
 +'border-radius:.5rem;font:inherit;font-size:1.0625rem;font-weight:600;'
 +'background:#c9a227;color:#2a2318">Start a new career</button>';
var m=document.getElementById('m'),b=document.getElementById('b');
function drop(name){return new Promise(function(done){
  var r;try{r=indexedDB.deleteDatabase(name);}catch(e){return done(false);}
  r.onsuccess=function(){done(true);};r.onerror=function(){done(false);};
  r.onblocked=function(){done('blocked');};
  setTimeout(function(){done('blocked');},4000);});}
(async function(){
  var names={};names[DB]=1;
  if(indexedDB.databases){try{(await indexedDB.databases()).forEach(
    function(d){if(d.name)names[d.name]=1;});}catch(e){}}
  var out=await Promise.all(Object.keys(names).map(drop));
  try{sessionStorage.clear();}catch(e){}
  if(out.indexOf('blocked')!==-1){
    m.style.color='#d97b6c';
    m.textContent='Something else still has the save open. Close every other tab '
      +'and the home-screen app for this game, then try again.';
  }else{
    m.style.color='#8fbf6f';
    m.textContent='Cleared. This starts again at Data Clerk, day one.';
  }
  b.style.display='block';
  b.onclick=function(){location.reload();};
})();
})();</script><script>(function(){
var p=location.pathname;
if(p.charAt(p.length-1)!=='/')return;
location.replace('index.html'+location.search+location.hash);
})();</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":882608,"index.wasm":37695054},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	
<div id="phone-grid" style="position:fixed;inset:0;z-index:2147483646;
 pointer-events:none;display:none"></div>
<button id="phone-grid-off" style="-webkit-appearance:none;appearance:none;
 position:fixed;top:calc(6px + env(safe-area-inset-top,0px));right:6px;
 z-index:2147483647;display:none;padding:5px 9px;border-radius:999px;
 font:600 11px/1 -apple-system,system-ui,sans-serif;background:rgba(0,0,0,.55);
 color:#e3d9c6;border:1px solid rgba(227,217,198,.25)">grid off</button>
<script>(function(){
var KEY='exec-summary-grid';
var box=document.getElementById('phone-grid');
var off=document.getElementById('phone-grid-off');
if(!box||!off)return;

function build(){
  var w=window.innerWidth,h=window.innerHeight,cols=6;
  var cw=w/cols,rows=Math.max(1,Math.round(h/cw)),ch=h/rows;
  var letters='ABCDEFGHIJKL',out='';
  for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
    out+='<div style="position:absolute;left:'+(c*cw)+'px;top:'+(r*ch)+'px;'
      +'width:'+cw+'px;height:'+ch+'px;box-sizing:border-box;'
      +'border-right:1px solid rgba(201,169,110,.38);'
      +'border-bottom:1px solid rgba(201,169,110,.38)">'
      +'<span style="position:absolute;left:2px;top:1px;'
      +'font:600 9px/1 -apple-system,system-ui,sans-serif;'
      +'color:rgba(201,169,110,.85)">'+letters.charAt(c)+(r+1)+'</span></div>';
  }
  box.innerHTML=out;
}

function show(on){
  box.style.display=on?'block':'none';
  off.style.display=on?'block':'none';
  if(on)build();
  try{on?localStorage.setItem(KEY,'1'):localStorage.removeItem(KEY);}catch(e){}
}
window.__phoneGrid=function(){show(box.style.display==='none');};
off.onclick=function(){show(false);};
// Rebuilt on rotate and on the address bar collapsing, both of which change the
// viewport without a reload and would otherwise leave the grid the wrong size.
window.addEventListener('resize',function(){if(box.style.display!=='none')build();});
var want=false;try{want=localStorage.getItem(KEY)==='1';}catch(e){}
if(want)show(true);
})();</script>

 bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:2147483647;
 display:flex;flex-direction:column;align-items:center;gap:8px;
 font:600 13px/1 -apple-system,system-ui,sans-serif;transition:opacity .5s">
<div id="phone-offline" style="padding:8px 14px;border-radius:999px;
 background:rgba(0,0,0,.62);color:#a89e8c;
 border:1px solid rgba(227,217,198,.15)">Saving for offline...</div>
<div style="display:flex;gap:8px">

 display:block;padding:10px 16px;border-radius:999px;font:inherit;
 background:rgba(0,0,0,.62);color:#e3d9c6;
 border:1px solid rgba(227,217,198,.25)">Grid</button>
<button id="phone-reset-go" style="-webkit-appearance:none;appearance:none;
 display:block;padding:10px 16px;border-radius:999px;font:inherit;
 background:rgba(0,0,0,.62);color:#e3d9c6;
 border:1px solid rgba(227,217,198,.25)">Reset career</button></div></div>
<script>(function(){
var wrap=document.getElementById('phone-hud');
var btn=document.getElementById('phone-reset-go');
var say=document.getElementById('phone-offline');
if(!wrap||!btn||!say)return;

var grid=document.getElementById('phone-grid-on');
if(grid)grid.onclick=function(){if(window.__phoneGrid)window.__phoneGrid();};
var armed=false,timer,settled=false;
function fade(){wrap.style.opacity=0;setTimeout(function(){wrap.remove()},600);}
function idle(){clearTimeout(timer);timer=setTimeout(function(){
  if(settled)fade();else idle();},8000);}
idle();
btn.onclick=function(){
  clearTimeout(timer);
  if(!armed){
    armed=true;btn.textContent='Tap again to wipe the save';
    timer=setTimeout(function(){armed=false;btn.textContent='Reset career';idle();},4000);
    return;
  }
  try{localStorage.setItem('exec-summary-reset-career','1');}catch(e){
    btn.textContent='This browser will not let me';return;}
  location.reload();
};

function done(text,colour){settled=true;say.textContent=text;say.style.color=colour;idle();}
function standalone(){
  return window.navigator.standalone===true
    ||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);}
(async function(){
  if(!('serviceWorker' in navigator)){
    return done('No offline: the certificate is not trusted','#d97b6c');}
  try{
    var reg=await navigator.serviceWorker.ready;
    if(!navigator.serviceWorker.controller){
      if(reg.active)reg.active.postMessage('claim');
      await new Promise(function(res){
        navigator.serviceWorker.addEventListener('controllerchange',res,{once:true});
        setTimeout(res,8000);});
    }
    if(!navigator.serviceWorker.controller){
      return done('Offline save did not finish','#d97b6c');}
    await Promise.all(['index.wasm','index.pck'].map(function(f){return fetch(f);}));
    try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist();}
    catch(e){}
    if(!standalone())
      return done('Cached. Add to Home Screen to keep it','#c9a96e');
    done('Ready to play offline','#8fbf6f');
  }catch(e){done('Offline save failed','#d97b6c');}
})();
})();</script>
